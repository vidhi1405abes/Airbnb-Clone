<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="1200" height="750" fill="#F8FAFC"/>

  <!-- Header -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#FF385C"/>
    <text x="18" y="25" font-size="20" font-weight="bold" fill="white" text-anchor="middle">A</text>
    <text x="50" y="22" font-size="20" font-weight="bold" fill="#0F172A">Airbnb Vacation Rental Architecture</text>
    <text x="50" y="38" font-size="13" fill="#64748B">Simple, Scalable Production Blueprint (4-Tier Design)</text>
  </g>

  <!-- Flow Marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- TIER 1: CLIENTS -->
  <g transform="translate(50, 110)">
    <rect width="1100" height="80" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>
    <text x="30" y="46" font-size="15" font-weight="bold" fill="#475569">1. CLIENTS</text>
    
    <rect x="220" y="18" width="250" height="44" rx="8" fill="#F1F5F9"/>
    <text x="345" y="45" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Desktop Web Browser</text>
    
    <rect x="500" y="18" width="250" height="44" rx="8" fill="#F1F5F9"/>
    <text x="625" y="45" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Mobile Web and Apps</text>

    <rect x="780" y="18" width="280" height="44" rx="8" fill="#F1F5F9"/>
    <text x="920" y="45" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">React 18 + Tailwind CSS</text>
  </g>

  <!-- Line 1 -->
  <line x1="600" y1="190" x2="600" y2="220" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- TIER 2: EDGE & GATEWAY -->
  <g transform="translate(50, 220)">
    <rect width="1100" height="85" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>
    <text x="30" y="48" font-size="15" font-weight="bold" fill="#475569">2. EDGE &amp; GATEWAY</text>

    <rect x="220" y="18" width="390" height="48" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <text x="240" y="38" font-size="14" font-weight="bold" fill="#1D4ED8">Global CDN &amp; Asset Cache</text>
    <text x="240" y="54" font-size="11" fill="#3B82F6">Cloudflare Edge: Sub-10ms global latency &amp; WebP optimization</text>

    <rect x="640" y="18" width="420" height="48" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
    <text x="660" y="38" font-size="14" font-weight="bold" fill="#6D28D9">API Gateway</text>
    <text x="660" y="54" font-size="11" fill="#7C3AED">Authentication, rate limiting, and request routing</text>
  </g>

  <!-- Line 2 -->
  <line x1="600" y1="305" x2="600" y2="335" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- TIER 3: MICROSERVICES -->
  <g transform="translate(50, 335)">
    <rect width="1100" height="170" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>
    <text x="30" y="35" font-size="15" font-weight="bold" fill="#475569">3. CORE SERVICES</text>
    
    <!-- Service 1: Listings -->
    <g transform="translate(30, 50)">
      <rect width="240" height="100" rx="10" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.5"/>
      <text x="20" y="30" font-size="14" font-weight="bold" fill="#E11D48">Listing Service</text>
      <text x="20" y="54" font-size="12" fill="#475569">- Property details &amp; specs</text>
      <text x="20" y="72" font-size="12" fill="#475569">- 5-Photo hero &amp; room tour</text>
      <text x="20" y="90" font-size="12" fill="#475569">- Amenities &amp; host rules</text>
    </g>

    <!-- Service 2: Availability -->
    <g transform="translate(300, 50)">
      <rect width="240" height="100" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
      <text x="20" y="30" font-size="14" font-weight="bold" fill="#DC2626">Booking &amp; Availability</text>
      <text x="20" y="54" font-size="12" fill="#475569">- Real-time calendar engine</text>
      <text x="20" y="72" font-size="12" fill="#475569">- 10-sec checkout lock</text>
      <text x="20" y="90" font-size="12" fill="#DC2626" font-weight="600">- Zero double-booking guarantee</text>
    </g>

    <!-- Service 3: Search -->
    <g transform="translate(570, 50)">
      <rect width="240" height="100" rx="10" fill="#FEFCE8" stroke="#FEF08A" stroke-width="1.5"/>
      <text x="20" y="30" font-size="14" font-weight="bold" fill="#CA8A04">Search &amp; Location</text>
      <text x="20" y="54" font-size="12" fill="#475569">- Multi-city Goa destinations</text>
      <text x="20" y="72" font-size="12" fill="#475569">- Map coordinates &amp; pins</text>
      <text x="20" y="90" font-size="12" fill="#475569">- Filter by guests &amp; price</text>
    </g>

    <!-- Service 4: Pricing -->
    <g transform="translate(840, 50)">
      <rect width="230" height="100" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
      <text x="20" y="30" font-size="14" font-weight="bold" fill="#16A34A">Pricing &amp; Reviews</text>
      <text x="20" y="54" font-size="12" fill="#475569">- Nightly rates + cleaning fee</text>
      <text x="20" y="72" font-size="12" fill="#475569">- Taxes &amp; fees calculation</text>
      <text x="20" y="90" font-size="12" fill="#475569">- 6-category ratings breakdown</text>
    </g>
  </g>

  <!-- Line 3 -->
  <line x1="600" y1="505" x2="600" y2="535" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- TIER 4: DATA -->
  <g transform="translate(50, 535)">
    <rect width="1100" height="155" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>
    <text x="30" y="35" font-size="15" font-weight="bold" fill="#475569">4. DATA &amp; STORAGE</text>

    <!-- DB 1: Postgres -->
    <g transform="translate(30, 50)">
      <rect width="330" height="85" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="20" y="30" font-size="14" font-weight="bold" fill="#0F172A">PostgreSQL (Primary DB)</text>
      <text x="20" y="52" font-size="12" fill="#64748B">- Full ACID transactions for reservations &amp; listings</text>
      <text x="20" y="70" font-size="12" fill="#64748B">- User profiles, verified guests &amp; review history</text>
    </g>

    <!-- DB 2: Redis -->
    <g transform="translate(385, 50)">
      <rect width="330" height="85" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="20" y="30" font-size="14" font-weight="bold" fill="#DC2626">Redis Cache &amp; Locks</text>
      <text x="20" y="52" font-size="12" fill="#64748B">- Distributed locking (Redlock) during checkout</text>
      <text x="20" y="70" font-size="12" fill="#64748B">- Sub-millisecond calendar availability lookups</text>
    </g>

    <!-- DB 3: Search & Kafka -->
    <g transform="translate(740, 50)">
      <rect width="330" height="85" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="20" y="30" font-size="14" font-weight="bold" fill="#0284C7">OpenSearch &amp; Kafka</text>
      <text x="20" y="52" font-size="12" fill="#64748B">- Fast map search and radius discovery</text>
      <text x="20" y="70" font-size="12" fill="#64748B">- Real-time event pipeline for inventory updates</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="50" y="725" font-size="11" fill="#94A3B8">Airbnb Clone Architecture Blueprint | Playpower Labs Submission | Clean 4-Tier Design</text>
</svg>
